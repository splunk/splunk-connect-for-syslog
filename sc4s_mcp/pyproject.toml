[tool.poetry]
name = "sc4s-mcp"
version = "3.47.0"
description = "MCP server for SC4S"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
fastmcp = "^3.2"
httpx = "^0.28.1"
fastapi = "^0.136.1"
starlette = ">=1.3.1,<2"
# Security minimums for runtime dependencies pulled in transitively.
anyio = ">=4.14.2,<5"
authlib = ">=1.7.2"
cryptography = ">=50.0.2,<51"
mcp = ">=1.30.0,<2"
PyJWT = ">=2.15.1,<3"
pydantic-settings = ">=2.14.2,<3"
python-multipart = ">=0.0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
