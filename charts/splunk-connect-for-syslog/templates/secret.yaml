{{- $cfg := include "splunk-connect-for-syslog.settings" . | fromYaml }}
{{- if not .Values.splunk.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: splunk-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splunk-connect-for-syslog.labels" . | nindent 4 }}
data:
  hec_token: {{ $cfg.hecToken | default "" | b64enc | quote }}
{{- end }}
