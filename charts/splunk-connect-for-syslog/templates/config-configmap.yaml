{{- $cfg := include "splunk-connect-for-syslog.settings" . | fromYaml }}
{{- if $cfg.configFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "splunk-connect-for-syslog.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splunk-connect-for-syslog.labels" . | nindent 4 }}
data:
{{ toYaml $cfg.configFiles | indent 2 }}
{{- end }}