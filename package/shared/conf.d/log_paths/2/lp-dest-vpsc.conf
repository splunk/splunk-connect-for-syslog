log {
    if {
        filter(f_host_is_nil_or_ip);
    } elif {
        filter {
            (
                "${fields.sc4s_vendor}" eq "nix"
                and "${fields.sc4s_product}" eq "syslog"
            )
            or "${fields.sc4s_vendor}" eq "splunk"
        };
    } elif {
        filter {
            match("^(true|1|t|y|yes)$" template("`SC4S_USE_VPS_CACHE`") flags(ignore-case))
        };
        destination(d_vpsc);
    };
    flags(catchall);
};