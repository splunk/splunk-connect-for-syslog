[tool.poetry]
name = "splunk-connect-for-syslog"
version = "3.46.0"
description = ""
authors = ["rjha-splunk <rjha@splunk.com>"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = ">3.11.0,<4.0"
Jinja2 = "^3.1.3"
requests = "^2.33.0"
shortuuid = "^1.0.11"
pyyaml = "6.0.3"
setuptools = "^84.0.0"
restricted-sqlitedict = "^1.0.0"
tornado = "^6.5.5"
gunicorn = "^26.0.0"
flask = "^3.1.0"
zipp = "^4.0.0"
cryptography = "^50.0.0"
flask-wtf = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-xdist = "^3.0.0"
jinja2-time = "^0.2.0"
splunk-sdk = "^2.0.0"
flake8 = "^7.0.0"
pytz = "^2026.0.0"
flaky = "^3.7.0"
lovely-pytest-docker = "^1.0.0"
pathlib2 = "^2.3.7"
requests = "^2.33.0"
junit-xml = "^1.9"
scapy = "^2.7.0"

# Zensical (successor to Material for MkDocs) is the docs generator.
zensical = ">=0.0.57"
# Versioning uses the Material team's mike fork.
mike = {git = "https://github.com/squidfunk/mike.git", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac"}
pre-commit = "^4.0.0"
typing-extensions = "*"
black = "^26.3.1"


[tool.pytest.ini_options]
markers = [
    "lite: test for lite version without addons",
    "addons: tests for addons",
    "features: tests for SC4S features",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
