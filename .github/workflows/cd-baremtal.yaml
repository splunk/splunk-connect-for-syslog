name: cd-baremtal
on:
  push:
    branches-ignore:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
      - id: byoe
        name: Produce BYOE package
        run: |
          pip3 install --only-binary :all: poetry
          poetry self add poetry-plugin-export
          poetry export --without-hashes >package/etc/requirements.txt
          tar rvf /tmp/baremetal.tar -C package/etc .
          tar rvf /tmp/baremetal.tar -C . pyproject.toml
          tar rvf /tmp/baremetal.tar -C . poetry.lock
          tar rvf /tmp/baremetal.tar -C package/sbin .
          tar rvf /tmp/baremetal.tar --transform 's,^\.,conf.d,' -C package/shared/conf.d .
          tar rvf /tmp/baremetal.tar --transform 's,^\.,conf.d/conflib,' -C package/shared/addons .
          tar rvf /tmp/baremetal.tar -C package/shared pylib
          tar rvf /tmp/baremetal.tar -C package/shared context_templates
          tar rvf /tmp/baremetal.tar -C package/shared local_config
          tar rvf /tmp/baremetal.tar -C package/shared test_parsers
          sha512sum -b /tmp/baremetal.tar > /tmp/baremetal_checksum.txt
      - name: Validate BYOE package
        run: |
          poetry install
          BAREMETAL_TAR=/tmp/baremetal.tar poetry run pytest tests/test_baremetal_package.py -v -m baremetal
      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: /tmp/baremetal.tar, /tmp/baremetal_checksum.txt
